<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Console</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body {
            background-color: #0a0a0f;
            color: #e6edf3;
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            padding: 20px;
            font-size: 14px;
        }
        .container {
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            background: #0d1117;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 15px 20px;
            border-bottom: 1px solid #30363d;
            background: #161b22;
        }
        .title-row {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .arch-row {
            color: #8b949e;
            font-size: 12px;
        }
        .best-params {
            color: #10b981;
            font-size: 12px;
            margin-top: 4px;
        }
        .charts-row {
            display: flex;
            border-bottom: 1px solid #30363d;
        }
        .chart-box {
            flex: 1;
            padding: 15px;
            height: 220px;
        }
        .chart-box:first-child { border-right: 1px solid #30363d; }
        
        .section-title {
            color: #8b949e;
            font-size: 12px;
            padding: 15px 20px 5px;
            text-transform: uppercase;
        }
        
        .metrics-table-wrapper {
            padding: 0 20px;
            max-height: 150px;
            overflow-y: auto;
            border-bottom: 1px solid #30363d;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            text-align: left;
            padding: 6px;
            border-bottom: 1px solid #21262d;
        }
        th { color: #8b949e; position: sticky; top: 0; background: #0d1117; }
        tr:last-child { color: #10b981; font-weight: bold; }
        
        .groq-commentary {
            padding: 15px 20px;
            border-bottom: 1px solid #30363d;
            font-size: 14px;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.05);
            transition: opacity 0.5s;
        }
        .groq-title {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .raw-log {
            padding: 15px 20px;
            height: 120px;
            overflow-y: auto;
            color: #8b949e;
            font-size: 12px;
            background: #0a0a0f;
            line-height: 1.5;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-row">
                <span style="color:#6366f1">LIVE TRAINING</span>
                <span id="epoch-counter">Epoch 0 / 0</span>
            </div>
            <div class="arch-row" id="arch-desc">Architecture: ...</div>
            <div class="best-params" id="best-params-desc">Config: ...</div>
        </div>
        
        <div class="charts-row">
            <div class="chart-box">
                <canvas id="lossChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="accChart"></canvas>
            </div>
        </div>

        <div class="section-title">EPOCH METRICS</div>
        <div class="metrics-table-wrapper" id="metrics-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Epoch</th><th>Loss</th><th>Val Loss</th><th>Acc</th><th>Val Acc</th>
                    </tr>
                </thead>
                <tbody id="metrics-body">
                </tbody>
            </table>
        </div>

        <div class="groq-commentary">
            <div class="groq-title">🧠 GROQ LIVE OBSERVATION</div>
            <div id="groq-text">Awaiting initial epochs for analysis...</div>
        </div>

        <div class="section-title">SUBPROCESS LOG</div>
        <div class="raw-log" id="log-box"></div>
    </div>

    <script>
        Chart.defaults.color = '#8b949e';
        Chart.defaults.font.family = "'JetBrains Mono', monospace";

        let lossChart = null;
        let accChart  = null;
        let lastEpoch = 0;

        function initCharts() {
            const lossCtx = document.getElementById('lossChart');
            const accCtx  = document.getElementById('accChart');
            if (!lossCtx || !accCtx) return;
            
            const makeOptions = (title, yLabel) => ({
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 300 },
                scales: {
                    x: {
                        ticks: { color: '#8b949e', font: { size: 10 } },
                        grid:  { color: 'rgba(255,255,255,0.05)' },
                        title: { display: true, text: 'Epoch',
                                color: '#8b949e', font: { size: 11 } }
                    },
                    y: {
                        ticks: { color: '#8b949e', font: { size: 10 } },
                        grid:  { color: 'rgba(255,255,255,0.05)' },
                        beginAtZero: false,
                        title: { display: true, text: yLabel,
                                color: '#8b949e', font: { size: 11 } }
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: { color: '#8b949e', font: { size: 10 }, boxWidth: 12, padding: 8 }
                    },
                    title: {
                        display: true,
                        text: title,
                        color: '#e6edf3',
                        font: { size: 13, weight: 'bold' },
                        padding: { bottom: 6 }
                    }
                }
            });
            
            lossChart = new Chart(lossCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Train Loss',
                          data: [], borderColor: '#ec4899',
                          borderWidth: 2, pointRadius: 3,
                          backgroundColor: 'rgba(236,72,153,0.1)',
                          tension: 0.4, fill: true },
                        { label: 'Val Loss',
                          data: [], borderColor: '#6366f1',
                          borderWidth: 2, pointRadius: 3,
                          backgroundColor: 'rgba(99,102,241,0.1)',
                          borderDash: [4,4],
                          tension: 0.4, fill: true },
                    ]
                },
                options: makeOptions('Training Loss', 'Loss')
            });
            
            accChart = new Chart(accCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Train Acc',
                          data: [], borderColor: '#10b981',
                          borderWidth: 2, pointRadius: 3,
                          backgroundColor: 'rgba(16,185,129,0.1)',
                          tension: 0.4, fill: true },
                        { label: 'Val Acc',
                          data: [], borderColor: '#06b6d4',
                          borderWidth: 2, pointRadius: 3,
                          backgroundColor: 'rgba(6,182,212,0.1)',
                          borderDash: [4,4],
                          tension: 0.4, fill: true },
                    ]
                },
                options: makeOptions('Accuracy (%)', 'Accuracy')
            });
        }

        function updateCharts(metrics) {
            if (!lossChart || !accChart) initCharts();
            if (!metrics || metrics.length === 0) return;
            
            // Only add NEW epochs since last update
            const newMetrics = metrics.filter(m => m.epoch > lastEpoch);
            if (newMetrics.length === 0) return;
            
            newMetrics.forEach(m => {
                const label = `E${m.epoch}`;
                lossChart.data.labels.push(label);
                lossChart.data.datasets[0].data.push(
                    parseFloat(m.loss?.toFixed(4) || 0)
                );
                lossChart.data.datasets[1].data.push(
                    parseFloat(m.val_loss?.toFixed(4) || 0)
                );
                accChart.data.labels.push(label);
                accChart.data.datasets[0].data.push(
                    parseFloat(((m.acc != null ? m.acc : 0) * 100).toFixed(2))
                );
                accChart.data.datasets[1].data.push(
                    parseFloat(((m.val_acc != null ? m.val_acc : 0) * 100).toFixed(2))
                );
                lastEpoch = m.epoch;
            });
            
            lossChart.update('none');
            accChart.update('none');
        }

        function updateTable(metrics) {
            if (!metrics) return;
            let tableHTML = '';
            metrics.forEach(m => {
                tableHTML += `<tr>
                    <td>${m.epoch}</td>
                    <td>${m.loss?.toFixed(4) || '-'}</td>
                    <td>${m.val_loss?.toFixed(4) || '-'}</td>
                    <td>${m.acc?.toFixed(4) || '-'}</td>
                    <td>${m.val_acc?.toFixed(4) || '-'}</td>
                </tr>`;
            });
            const tbody = document.getElementById('metrics-body');
            tbody.innerHTML = tableHTML;
            const scrollDiv = document.getElementById('metrics-scroll');
            scrollDiv.scrollTop = scrollDiv.scrollHeight;
        }

        function updateHeader(state) {
            document.getElementById('epoch-counter').innerText = `Epoch ${state.current_epoch || 0} / ${state.total_epochs || 0}`;
            document.getElementById('arch-desc').innerText = `Architecture: ${state.architecture || "Unknown"}`;
            
            if (state.best_params && Object.keys(state.best_params).length > 0) {
                const bpStrings = Object.entries(state.best_params).map(([k,v]) => `${k}=${typeof v === 'number' ? v.toFixed(4).replace(/\.0000$/, '') : v}`);
                document.getElementById('best-params-desc').innerText = `Config: ${bpStrings.join(', ')}`;
            }

            if (state.groq_commentary) {
                document.getElementById('groq-text').innerText = state.groq_commentary;
            }
        }

        function updateLog(logs) {
            const logBox = document.getElementById('log-box');
            if (logs && logs.length > 0) {
                const curLog = logs.map(l => `> ${l}`).join('<br>');
                if (logBox.innerHTML !== curLog) {
                    logBox.innerHTML = curLog;
                    logBox.scrollTop = logBox.scrollHeight;
                }
            }
        }

        // Poll /training-status every 800ms
        async function poll() {
            try {
                const res  = await fetch('/training-status');
                const data = await res.json();
                updateCharts(data.metrics || []);
                updateTable(data.metrics || []);
                updateHeader(data);
                updateLog(data.logs || []);
                if (data.status === 'complete' || 
                    data.status === 'error') {
                    if (pollTimer) clearInterval(pollTimer);
                }
            } catch(e) {}
        }
        
        let pollTimer;
        // Initialize charts immediately, start polling
        document.addEventListener('DOMContentLoaded', () => {
            initCharts();
            pollTimer = setInterval(poll, 800);
            poll(); // immediate first poll
        });
    </script>
</body>
</html>
